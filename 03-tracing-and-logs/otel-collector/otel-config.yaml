## OpenTelemetry Collector — receivers / processors / exporters
## Anchor: deck §6 (sampling math + semantic conventions).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Read Docker container stdout logs for Loki
  filelog:
    include:
      - /var/lib/docker/containers/*/*-json.log
    include_file_name: false
    include_file_path: true
    start_at: end
    operators:
      # Parse Docker JSON log line {log, stream, time}
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: '%Y-%m-%dT%H:%M:%S.%fZ'
        id: docker-parser
      # Extract the 'log' field (the actual app log message) as body
      - type: move
        from: attributes.log
        to: body
        id: extract-log

  # Self-metrics (Prometheus-scrapeable on :8888 — see prometheus.yml)
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8888']

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

  # Composite tail-sampling: keep all errors + slow + 1% healthy
  tail_sampling:
    decision_wait: 30s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: keep-slow
        type: latency
        latency: { threshold_ms: 2000 }
      - name: probabilistic-1pct
        type: probabilistic
        probabilistic: { sampling_percentage: 1 }

  # Add deployment env to every span/metric resource attribute
  resource:
    attributes:
      - key: deployment.environment
        value: lab
        action: upsert

  # Resource processor for logs only - set service name for filelog entries
  resource/logs:
    attributes:
      - key: deployment.environment
        value: lab
        action: upsert
      - key: service.name
        value: inference-api
        action: upsert

exporters:
  # Traces → Jaeger via OTLP
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Logs → Loki
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, resource, batch]
      exporters: [otlp/jaeger]

    metrics:
      receivers: [otlp, prometheus]
      processors: [resource, batch]
      exporters: [debug]

    logs:
      receivers: [filelog]
      processors: [resource/logs, batch]
      exporters: [loki, debug]

  telemetry:
    logs:
      level: warn
    metrics:
      address: 0.0.0.0:8888
